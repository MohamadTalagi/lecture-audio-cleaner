<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* UST Blue #003366 (Pantone 295) · UST Gold #996600 (Pantone 872) */
  :root { color-scheme: dark; --blue:#003366; --gold:#996600; --gold-text:#d4a13c; --bg:#0b1522; --ink:#e8edf3; --muted:#8b98aa; --line:#1c2b40; --track:#1a2a40; }
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 16px; background: var(--bg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .status { color: var(--muted); margin-bottom: 14px; min-height: 18px; }
  .status.on { color: var(--gold-text); font-weight: 600; }
  .status.err { color: #ff8a80; }
  button { width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 10px; font: 600 14px inherit; font-family: inherit; cursor: pointer; transition: filter .15s; }
  button:hover { filter: brightness(1.15); }
  button:focus-visible { outline: 2px solid var(--gold-text); outline-offset: 2px; }
  #main { background: var(--gold); color: #fff; }
  #main.stop { background: var(--blue); color: var(--ink); border-color: #0f4a85; }
  #ab { margin-top: 8px; background: transparent; color: var(--ink); border-color: var(--blue); font-weight: 500; font-size: 13px; padding: 8px; }
  #ab[hidden] { display: none; }
  .row { margin-top: 16px; }
  .row label { display: flex; justify-content: space-between; font-weight: 600; }
  .row label span { color: var(--gold-text); font-weight: 600; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 10px 0 2px; border-radius: 3px; cursor: pointer;
    background: linear-gradient(to right, var(--gold) 0 var(--p, 50%), var(--track) var(--p, 50%) 100%); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--gold); box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .hint { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .foot { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <h1><img src="icon48.png" alt="">Lecture Audio Cleaner</h1>
  <div id="status" class="status">Removes hum &amp; hiss and boosts the voice in this tab.</div>

  <button id="main">Clean this tab's audio</button>
  <button id="ab" hidden>Hear original (A/B)</button>

  <div class="row">
    <label for="hiss">Hiss reduction <span id="hissV"></span></label>
    <input id="hiss" type="range" min="0" max="100" step="5">
    <div class="hint">Lower it if the voice sounds watery or metallic.</div>
  </div>
  <div class="row">
    <label for="boost">Voice boost <span id="boostV"></span></label>
    <input id="boost" type="range" min="0" max="15" step="1">
  </div>

  <div class="foot">Hum filter adapts to 50 Hz or 60 Hz automatically. Works on one tab at a time.</div>
  <script src="popup.js"></script>
</body>
</html>
